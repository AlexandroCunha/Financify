# Render Blueprint: API (Node) + PostgreSQL database + static front-end.
# How to use: Render → New → Blueprint → pick this repository.
# Everything is on the free plan. Note: Render's free Postgres expires after 30 days
# and the API "sleeps" after 15 min without use (the first request after that takes ~1 min).

databases:
  - name: financify-db
    region: frankfurt
    plan: free
    databaseName: financify
    user: financify

services:
  # API: migrations run by themselves when the server starts (src/server.js).
  - type: web
    name: financify-api
    runtime: node
    region: frankfurt
    plan: free
    branch: feat/v2
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: financify-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Addresses allowed by CORS: the front-end and the portfolio (which calls /demo in its "Try the API" console).
      # If Render gives the front-end another name, change it here.
      - key: CORS_ORIGIN
        value: https://financify-web-m2zy.onrender.com,https://alexandrocunha.github.io

  # Front-end (React + Vite): builds frontend/dist and publishes it as a static site.
  - type: web
    name: financify-web
    runtime: static
    branch: feat/v2
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      # API address (baked into the build). If Render gives the API another name, change it here.
      - key: VITE_API_URL
        value: https://financify-api-m2zy.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
