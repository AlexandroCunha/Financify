# PostgreSQL for local development.
# Start:  docker compose up -d     Stop:  docker compose down
services:
  db:
    image: postgres:17-alpine
    container_name: financify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: financify
      POSTGRES_PASSWORD: financify
      POSTGRES_DB: financify
    ports:
      - "5433:5432" # 5433 so it does not clash with a PostgreSQL already installed on the machine
    volumes:
      - financify-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financify -d financify"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  # Kept with its original (Portuguese) name so existing local databases keep their data.
  financify-dados:
